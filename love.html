<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: 'Arial', sans-serif;
      overflow: hidden; /* Prevent scrollbars when button moves */
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      position: relative;
      z-index: 10;
    }

    h1 {
      color: #d6336c;
      margin-bottom: 10px;
      font-size: 2.5rem;
    }

    p {
      color: #555;
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      position: relative;
      height: 60px; /* Fixed height to keep layout stable */
    }

    button {
      padding: 15px 30px;
      font-size: 1.2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-weight: bold;
    }

    #yesBtn {
      background-color: #2ecc71;
      color: white;
      box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
    }

    #yesBtn:hover {
      transform: scale(1.1);
      background-color: #27ae60;
    }

    #noBtn {
      background-color: #e74c3c;
      color: white;
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
      position: absolute; /* Allows free movement */
      left: 50%; /* Start centered initially */
      transform: translateX(-50%);
    }

    /* Success Message State */
    .hidden {
      display: none;
    }

    #successMessage {
      animation: popIn 0.5s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }

    .heart-emoji {
      font-size: 3rem;
      margin-top: 20px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <!-- The Game Screen -->
  <div class="container" id="gameScreen">
    <h1>Will you be mine?</h1>
    <p>I've been wanting to ask you this for a while...</p>
    
    <div class="buttons">
      <button id="yesBtn">Yes! ❤️</button>
      <button id="noBtn">No 😢</button>
    </div>
  </div>

  <!-- The Success Screen -->
  <div class="container hidden" id="successMessage">
    <h1>Yay! I knew it! 🎉</h1>
    <p>You just made me the happiest person alive.</p>
    <div class="heart-emoji">💖💕💖</div>
    <p style="margin-top: 20px; font-size: 0.9rem; color: #888;">(And you can't say no anyway!)</p>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const gameScreen = document.getElementById('gameScreen');
    const successMessage = document.getElementById('successMessage');

    // Function to move the "No" button randomly
    function moveButton() {
      // Get the viewport dimensions
      const maxWidth = window.innerWidth - noBtn.offsetWidth - 20; // -20 for padding
      const maxHeight = window.innerHeight - noBtn.offsetHeight - 20;

      // Generate random coordinates
      const randomX = Math.floor(Math.random() * maxWidth);
      const randomY = Math.floor(Math.random() * maxHeight);

      // Apply new position
      noBtn.style.position = 'fixed'; // Switch to fixed to move anywhere on screen
      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
      
      // Remove the transform that was centering it initially
      noBtn.style.transform = 'none';
    }

    // Event listeners for when the mouse tries to hover over "No"
    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('click', moveButton); // Just in case they click it fast

    // Event listener for "Yes"
    yesBtn.addEventListener('click', () => {
      gameScreen.classList.add('hidden');
      successMessage.classList.remove('hidden');
      createConfetti();
    });

    // Simple Confetti Effect (Visual Flair)
    function createConfetti() {
      const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff'];
      
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.style.position = 'fixed';
        confetti.style.width = '10px';
        confetti.style.height = '10px';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.top = '-10px';
        confetti.style.zIndex = '1000';
        confetti.style.borderRadius = '50%';
        document.body.appendChild(confetti);

        // Animate falling
        const duration = Math.random() * 2 + 2; // 2 to 4 seconds
        confetti.style.transition = `top ${duration}s ease-out, transform ${duration}s linear`;
        
        setTimeout(() => {
          confetti.style.top = '110vh';
          confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
        }, 100);

        // Cleanup
        setTimeout(() => {
          confetti.remove();
        }, duration * 1000);
      }
    }
  </script>
</body>
</html>
