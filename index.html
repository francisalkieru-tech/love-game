<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2340 0%, #1b3a63 45%, #2a5a8a 100%);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Floating animated flowers background */
    .flower {
      position: fixed;
      top: -60px;
      font-size: 2rem;
      user-select: none;
      pointer-events: none;
      opacity: 0.85;
      animation: fall linear infinite, sway ease-in-out infinite;
      z-index: 1;
    }

    @keyframes fall {
      0% { top: -60px; }
      100% { top: 110vh; }
    }

    @keyframes sway {
      0%, 100% { margin-left: 0px; }
      50% { margin-left: 40px; }
    }

    .container {
      text-align: center;
      background: rgba(10, 25, 47, 0.75);
      backdrop-filter: blur(6px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.4);
      border: 1px solid rgba(120, 180, 255, 0.25);
      position: relative;
      z-index: 10;
    }

    h1 {
      color: #7ec8ff;
      margin-bottom: 10px;
      font-size: 2.5rem;
      text-shadow: 0 0 15px rgba(126, 200, 255, 0.5);
    }

    p {
      color: #cfe4ff;
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      position: relative;
      height: 60px;
    }

    button {
      padding: 15px 30px;
      font-size: 1.2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-weight: bold;
    }

    #yesBtn {
      background-color: #2e86de;
      color: white;
      box-shadow: 0 4px 15px rgba(46, 134, 222, 0.5);
    }

    #yesBtn:hover {
      transform: scale(1.1);
      background-color: #1b6fc9;
    }

    #noBtn {
      background-color: #3a4a63;
      color: #cfe4ff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .hidden {
      display: none;
    }

    #successMessage {
      animation: popIn 0.5s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }

    .heart-emoji {
      font-size: 3rem;
      margin-top: 20px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <div id="flowerLayer"></div>

  <!-- The Game Screen -->
  <div class="container" id="gameScreen">
    <h1>Crush moko no? 👀</h1>
    <p>Tanong lang naman eh😜</p>

    <div class="buttons">
      <button id="yesBtn">Oo! 😁</button>
      <button id="noBtn">Ayoko 😠</button>
    </div>
  </div>

  <!-- The Success Screen -->
  <div class="container hidden" id="successMessage">
    <h1>Yehey! 🎉</h1>
    <p>Sabi ko na eh, nahiya kapa.</p>
    <div class="heart-emoji">🫶🫶</div>
    <p style="margin-top: 20px; font-size: 0.9rem; color: #9fc4ec;">HAHAHAHAHA</p>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const gameScreen = document.getElementById('gameScreen');
    const successMessage = document.getElementById('successMessage');
    const flowerLayer = document.getElementById('flowerLayer');

    // Create floating flower background
    const flowerEmojis = ['🌸', '🌼', '💠', '❄️', '🌷'];
    function createFlowers() {
      const count = 25;
      for (let i = 0; i < count; i++) {
        const flower = document.createElement('div');
        flower.className = 'flower';
        flower.textContent = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
        flower.style.left = Math.random() * 100 + 'vw';
        flower.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
        const fallDuration = Math.random() * 8 + 7;
        const swayDuration = Math.random() * 3 + 2;
        flower.style.animationDuration = `${fallDuration}s, ${swayDuration}s`;
        flower.style.animationDelay = `${Math.random() * 10}s, 0s`;
        flowerLayer.appendChild(flower);
      }
    }
    createFlowers();

    // Function to move the "No" button randomly
    function moveButton() {
      const maxWidth = window.innerWidth - noBtn.offsetWidth - 20;
      const maxHeight = window.innerHeight - noBtn.offsetHeight - 20;

      const randomX = Math.floor(Math.random() * maxWidth);
      const randomY = Math.floor(Math.random() * maxHeight);

      noBtn.style.position = 'fixed';
      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';

      noBtn.style.transform = 'none';
    }

    noBtn.addEventListener('mouseover', () => {
      moveButton();
    });
    noBtn.addEventListener('click', moveButton);

    yesBtn.addEventListener('click', () => {
      gameScreen.classList.add('hidden');
      successMessage.classList.remove('hidden');
      createConfetti();
    });

    // Simple Confetti Effect (Visual Flair) - blue tones
    function createConfetti() {
      const colors = ['#2e86de', '#7ec8ff', '#cfe4ff', '#1b6fc9', '#a3d5ff'];

      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.style.position = 'fixed';
        confetti.style.width = '10px';
        confetti.style.height = '10px';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.top = '-10px';
        confetti.style.zIndex = '1000';
        confetti.style.borderRadius = '50%';
        document.body.appendChild(confetti);

        const duration = Math.random() * 2 + 2;
        confetti.style.transition = `top ${duration}s ease-out, transform ${duration}s linear`;

        setTimeout(() => {
          confetti.style.top = '110vh';
          confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
        }, 100);

        setTimeout(() => {
          confetti.remove();
        }, duration * 1000);
      }
    }
  </script>
</body>
</html>
